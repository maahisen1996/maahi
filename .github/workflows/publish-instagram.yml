name: Legacy Mahi Instagram Publisher (manual fallback)

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: "Queue post ID to publish manually, e.g. 02"
        required: true
        type: string

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-24.04
    steps:
      - name: Cloudflare is now the scheduler
        run: |
          echo "Scheduled Instagram publishing has moved to Cloudflare Workers."
          echo "This GitHub workflow is retained only as a visible manual fallback marker."
          echo "Requested post_id: ${{ github.event.inputs.post_id }}"
