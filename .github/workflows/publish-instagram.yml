name: Mahi Automation Diagnostic

on:
  push:
    paths:
      - "content.json"
      - "media/mahi-intro.b64"
      - ".github/workflows/publish-instagram.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Decode and validate image
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode media/mahi-intro.b64 > /tmp/mahi-intro.jpg
          file /tmp/mahi-intro.jpg
          ls -lh /tmp/mahi-intro.jpg
          python - <<'PY'
          from pathlib import Path
          p = Path("/tmp/mahi-intro.jpg")
          data = p.read_bytes()
          assert data[:2] == b"\xff\xd8", "Not a JPEG"
          assert len(data) > 10000, f"Image is unexpectedly small: {len(data)} bytes"
          print(f"JPEG validation passed: {len(data)} bytes")
          PY

      - name: Verify public image URL
        shell: bash
        run: |
          set -euo pipefail
          URL="https://raw.githubusercontent.com/maahisen1996/maahi/main/media/mahi-intro.jpg"
          echo "Checking: $URL"
          curl -fsSLI "$URL"
