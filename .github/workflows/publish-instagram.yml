name: Prepare Mahi Image

on:
  push:
    paths:
      - "content.json"
      - "media/mahi-intro.b64"
      - ".github/workflows/publish-instagram.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Materialize JPEG
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode media/mahi-intro.b64 > media/mahi-intro.jpg
          python - <<'PY'
          from pathlib import Path
          p=Path("media/mahi-intro.jpg")
          data=p.read_bytes()
          assert data[:2] == b"\xff\xd8", "Not a JPEG"
          assert len(data) > 10000, f"Image unexpectedly small: {len(data)} bytes"
          print(f"Validated JPEG: {len(data)} bytes")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/mahi-intro.jpg
          if ! git diff --cached --quiet; then
            git commit -m "chore: materialize Mahi image"
            git push
          else
            echo "Image already present and unchanged."
          fi
