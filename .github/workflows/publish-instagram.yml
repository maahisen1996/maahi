name: Publish Mahi Instagram

on:
  push:
    paths:
      - ".github/workflows/publish-instagram.yml"
      - "content.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Materialize and validate JPEG
        id: image
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, pathlib

          s = pathlib.Path("media/mahi-intro.b64").read_text().strip()
          data = base64.b64decode(s, validate=True)
          if not (data.startswith(b"\xff\xd8") and data.endswith(b"\xff\xd9") and len(data) > 10000):
              raise SystemExit("Invalid JPEG payload")
          pathlib.Path("media/mahi-intro.jpg").write_bytes(data)
          print(f"JPEG validated: {len(data)} bytes")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/mahi-intro.jpg
          if ! git diff --cached --quiet; then
            git commit -m "chore: materialize Mahi JPEG"
            git push
          fi

          PUBLISHED_SHA=$(git rev-parse HEAD)
          IMAGE_URL="https://raw.githubusercontent.com/maahisen1996/maahi/$PUBLISHED_SHA/media/mahi-intro.jpg"
          echo "image_url=$IMAGE_URL" >> "$GITHUB_OUTPUT"
          curl -fsSLI "$IMAGE_URL" >/dev/null

      - name: Read caption
        id: content
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          with open("content.json", encoding="utf-8") as f:
              d=json.load(f)
          print("caption<<EOF")
          print(d["caption"])
          print("EOF")
          PY

      - name: Identify Instagram account
        id: account
        env:
          ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS }}
        shell: bash
        run: |
          set -euo pipefail
          ACCESS_TOKEN=$(printf '%s' "$ACCESS_TOKEN" | tr -d '[:space:]')
          RESPONSE=$(curl -G -sS "https://graph.instagram.com/v25.0/me"             --data-urlencode "fields=user_id,username,account_type"             -H "Authorization: Bearer $ACCESS_TOKEN")
          echo "$RESPONSE"
          IG_USER_ID=$(python -c 'import json,sys; print(json.load(sys.stdin)["user_id"])' <<< "$RESPONSE")
          echo "ig_user_id=$IG_USER_ID" >> "$GITHUB_OUTPUT"

      - name: Create Instagram media container
        id: container
        env:
          IG_USER_ID: ${{ steps.account.outputs.ig_user_id }}
          ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS }}
          IMAGE_URL: ${{ steps.image.outputs.image_url }}
          CAPTION: ${{ steps.content.outputs.caption }}
        shell: bash
        run: |
          set -euo pipefail
          ACCESS_TOKEN=$(printf '%s' "$ACCESS_TOKEN" | tr -d '[:space:]')
          RESPONSE=$(curl -sS -X POST             "https://graph.instagram.com/v25.0/$IG_USER_ID/media"             -H "Authorization: Bearer $ACCESS_TOKEN"             --data-urlencode "image_url=$IMAGE_URL"             --data-urlencode "caption=$CAPTION")
          echo "$RESPONSE"
          CONTAINER_ID=$(python -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<< "$RESPONSE")
          echo "container_id=$CONTAINER_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for Instagram processing
        env:
          ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS }}
          CONTAINER_ID: ${{ steps.container.outputs.container_id }}
        shell: bash
        run: |
          set -euo pipefail
          ACCESS_TOKEN=$(printf '%s' "$ACCESS_TOKEN" | tr -d '[:space:]')
          for i in {1..18}; do
            RESPONSE=$(curl -G -sS "https://graph.instagram.com/v25.0/$CONTAINER_ID"               --data-urlencode "fields=status_code,status"               -H "Authorization: Bearer $ACCESS_TOKEN")
            echo "$RESPONSE"
            STATUS=$(python -c 'import json,sys; print(json.load(sys.stdin).get("status_code",""))' <<< "$RESPONSE")
            case "$STATUS" in
              FINISHED) exit 0 ;;
              ERROR|EXPIRED)
                echo "Instagram processing failed: $STATUS"
                exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for Instagram processing."
          exit 1

      - name: Publish to Instagram
        env:
          IG_USER_ID: ${{ steps.account.outputs.ig_user_id }}
          ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS }}
          CONTAINER_ID: ${{ steps.container.outputs.container_id }}
        shell: bash
        run: |
          set -euo pipefail
          ACCESS_TOKEN=$(printf '%s' "$ACCESS_TOKEN" | tr -d '[:space:]')
          RESPONSE=$(curl -sS -X POST             "https://graph.instagram.com/v25.0/$IG_USER_ID/media_publish"             -H "Authorization: Bearer $ACCESS_TOKEN"             --data-urlencode "creation_id=$CONTAINER_ID")
          echo "$RESPONSE"
